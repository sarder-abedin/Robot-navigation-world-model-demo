# docker-compose.server.yml – Run the PC/Mac AI server + Streamlit UI viewer
#
# The container starts both the AI navigation server AND the Streamlit viewer.
# After starting, open http://localhost:8501 in your browser.
#
# Usage:
#   # Demo mode (no robot hardware):
#   docker compose -f docker-compose.server.yml up
#
#   # Live mode (robot Pi must connect on 5004/8004):
#   NAV_MODE=live docker compose -f docker-compose.server.yml up
#
#   # Predictive vs baseline comparison run:
#   NAV_STRATEGY=baseline docker compose -f docker-compose.server.yml up
#
# GPU variant (Linux + NVIDIA only):
#   docker build --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cu121 \
#                -f Dockerfile.server -t nav-server-gpu .
#   # then change image: below to nav-server-gpu and uncomment the deploy block

services:
  nav-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: nav-server:latest
    environment:
      - NAV_MODE=${NAV_MODE:-demo}
      - NAV_STRATEGY=${NAV_STRATEGY:-predictive}
    volumes:
      - ./logs_rpi:/app/logs_rpi            # persist run logs
      - ./assets:/app/assets:ro             # demo video clips
    ports:
      - "5003:5003"   # AI server cmd  (used by Streamlit viewer internally)
      - "8003:8003"   # AI server video (used by Streamlit viewer internally)
      - "5004:5004"   # Robot cmd
      - "8004:8004"   # Robot video
      - "8501:8501"   # Streamlit browser UI  ← open http://localhost:8501
    # Uncomment for NVIDIA GPU on Linux (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped
