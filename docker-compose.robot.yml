# docker-compose.robot.yml

services:
  nav-robot:
    build:
      context: .
      dockerfile: Dockerfile.robot

    image: nav-robot:latest

    # These forward shell env vars INTO the container. Without an entry here,
    # `SPEED_FULL=1500 docker compose up` is silently ignored (the var never
    # reaches the app). Set any of them inline or in a .env file, e.g.:
    #   SERVER_IP=192.168.68.107 SPEED_FULL=1500 \
    #     docker compose -f docker-compose.robot.yml up
    environment:
      SERVER_IP: ${SERVER_IP:-192.168.1.100}
      # Motor PWM duty (of 4095). Keep slow so the robot doesn't outrun perception.
      SPEED_FULL: ${SPEED_FULL:-1600}
      SPEED_SLOW: ${SPEED_SLOW:-1000}
      # Camera orientation (1 = flip) and GPIO chip number.
      CAMERA_HFLIP: ${CAMERA_HFLIP:-0}
      CAMERA_VFLIP: ${CAMERA_VFLIP:-0}
      GPIO_CHIP: ${GPIO_CHIP:-0}

    privileged: true

    devices:
      # Camera
      - /dev/video0:/dev/video0

      # Raspberry Pi Camera / libcamera
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1

      # GPIO (Pi 5)
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip0:/dev/gpiochip4

    volumes:
      - /run/udev:/run/udev:ro
      # DMA-heap: without it picamera2 can't open /dev/dma_heap/vidbuf_cached and
      # runs on a limited buffer pool that eventually STALLS the stream (the PC
      # then sees a frozen frame and watchdog-STOPs). Mounting it uses the proper
      # cached buffers and avoids the stall. (camera.py also auto-restarts on a
      # stall as a safety net.)
      - /dev/dma_heap:/dev/dma_heap

    network_mode: host

    restart: unless-stopped