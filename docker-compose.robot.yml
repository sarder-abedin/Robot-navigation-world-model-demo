# docker-compose.robot.yml – Run the Raspberry Pi robot client
#
# Usage (on Raspberry Pi):
#   SERVER_IP=192.168.1.42 docker compose -f docker-compose.robot.yml up
#
# Prerequisites on the host Pi:
#   sudo apt-get install -y libcamera-dev python3-libcamera python3-kms++

services:
  nav-robot:
    build:
      context: .
      dockerfile: Dockerfile.robot
    image: nav-robot:latest
    environment:
      - SERVER_IP=${SERVER_IP:-192.168.1.100}
    # Hardware access
    privileged: true          # simplest for dev; restrict in production
    devices:
      - /dev/video0:/dev/video0     # camera (USB webcam fallback)
      - /dev/gpiochip4:/dev/gpiochip4  # GPIO chip on Pi 5
      # Pi 4: use /dev/gpiochip0 instead
    volumes:
      - /run/udev:/run/udev:ro      # needed for libcamera device discovery
    network_mode: host              # use host network for simplest discovery
    restart: unless-stopped
