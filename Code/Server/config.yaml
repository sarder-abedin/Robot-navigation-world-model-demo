# ─────────────────────────────────────────────────────────────────────────────
# Predictive Navigation – Server-side Runtime Configuration
# Freenove Tank Robot Kit for Raspberry Pi (FNK0077)
# ─────────────────────────────────────────────────────────────────────────────

# ── Run mode ──────────────────────────────────────────────────────────────────
mode: demo          # "live" (physical Pi) | "demo" (recorded video on any machine)
navigation_mode: predictive   # "predictive" | "baseline"

# ── Camera / Frame buffer ──────────────────────────────────────────────────────
camera:
  # In demo mode this is the path to the recorded video file.
  demo_video_path: "../../assets/demo_clips/corridor.mp4"
  # Resolution the Pi camera streams at (used for AI; set in camera.py for streaming).
  stream_width: 400
  stream_height: 300
  # Number of frames kept in the rolling clip buffer for V-JEPA 2.
  # MUST match the checkpoint's frames-per-clip: vitl-fpc64 → 64.
  clip_length: 64
  # Target size that all frames are resized to before model inference.
  # MUST match the checkpoint's input resolution: vitl-...-256 → 256.
  # (SSv2/VideoMAE downsamples to its own 224 internally.)
  ai_frame_size: 256

# ── Detector (YOLO11) ─────────────────────────────────────────────────────────
# YOLO always runs HERE on the PC (both live and demo). The Pi is a thin client
# that only streams camera frames + ultrasonic; it never runs YOLO.
detector:
  model: "yolo11n.pt"             # nano; swap to yolo11s/yolo11m for more accuracy on the PC
  confidence_threshold: 0.40
  iou_threshold: 0.45
  # All 80 COCO classes the YOLO11 model can recognise are treated as obstacles,
  # so the robot classifies/avoids anything it detects (not just furniture).
  # Shorthand: set this to ["all"] (or []) to match every class without listing
  # them — handy if you swap in a model with a different class set.
  # To restrict avoidance to a subset, delete the classes you want to ignore.
  obstacle_classes:
    - "person"
    - "bicycle"
    - "car"
    - "motorcycle"
    - "airplane"
    - "bus"
    - "train"
    - "truck"
    - "boat"
    - "traffic light"
    - "fire hydrant"
    - "stop sign"
    - "parking meter"
    - "bench"
    - "bird"
    - "cat"
    - "dog"
    - "horse"
    - "sheep"
    - "cow"
    - "elephant"
    - "bear"
    - "zebra"
    - "giraffe"
    - "backpack"
    - "umbrella"
    - "handbag"
    - "tie"
    - "suitcase"
    - "frisbee"
    - "skis"
    - "snowboard"
    - "sports ball"
    - "kite"
    - "baseball bat"
    - "baseball glove"
    - "skateboard"
    - "surfboard"
    - "tennis racket"
    - "bottle"
    - "wine glass"
    - "cup"
    - "fork"
    - "knife"
    - "spoon"
    - "bowl"
    - "banana"
    - "apple"
    - "sandwich"
    - "orange"
    - "broccoli"
    - "carrot"
    - "hot dog"
    - "pizza"
    - "donut"
    - "cake"
    - "chair"
    - "couch"
    - "potted plant"
    - "bed"
    - "dining table"
    - "toilet"
    - "tv"
    - "laptop"
    - "mouse"
    - "remote"
    - "keyboard"
    - "cell phone"
    - "microwave"
    - "oven"
    - "toaster"
    - "sink"
    - "refrigerator"
    - "book"
    - "clock"
    - "vase"
    - "scissors"
    - "teddy bear"
    - "hair drier"
    - "toothbrush"
  # Fraction of frame width that counts as the "center danger zone"
  center_zone_ratio: 0.40
  # An obstacle is "close" when its bbox area exceeds this fraction of the frame
  close_area_threshold: 0.08
  # Run detector on every Nth frame to save CPU (1 = every frame)
  run_every_n_frames: 2

# ── V-JEPA 2 world model ──────────────────────────────────────────────────────
world_model:
  # HuggingFace model ID or local checkpoint path.
  # The system falls back to a lightweight stub when the weights are absent.
  model_id: "facebook/vjepa2-vitl-fpc64-256"
  input_size: 256              # MUST match the checkpoint (…-256); frames resized to this
  # BLOCKED/CLEAR label needs the obstacle-similarity to exceed clear-similarity
  # by this margin (relative test); below it → MIXED. Keeps the label off a
  # permanent BLOCKED when anchors are synthetic/uncalibrated.
  label_margin: 0.02
  # Calibrated corridor anchors (from calibrate_anchors.py). Empty = use the
  # synthetic grey-wall / open-corridor anchors (coarse). Point this at your
  # anchors.npz so BLOCKED/CLEAR reflects YOUR environment. See README.
  anchors_path: ""
  prediction_horizon: 4        # future frames to predict
  risk_similarity_threshold: 0.55
  # Compute device (portable). "auto" resolves CUDA → MPS → CPU and picks the best
  # available: NVIDIA CUDA, AMD ROCm (which registers as CUDA in PyTorch — see the
  # ROCm section in HOW_TO_RUN.md), or Apple MPS on a native Mac; else CPU. Force a
  # specific one with "cuda"/"mps"/"cpu" (each degrades gracefully if unavailable).
  device: "auto"               # auto = CUDA/ROCm → MPS → CPU; or force cuda/mps/cpu
  # GPU compute precision (CUDA/ROCm only; ignored on CPU/MPS, which stay fp32).
  # bf16 halves the attention ACTIVATION memory — the fix for the 12 GiB masked-
  # forward OOM on a 16 GB card — and roughly doubles speed, with negligible impact
  # on the cosine-similarity risk. On a GPU the model also loads with memory-
  # efficient (SDPA) attention, and if a forward STILL OOMs it offloads THAT forward
  # to CPU (correct but slow) instead of degrading the prediction.
  #   bf16 = bfloat16 (best on RDNA4 / Ampere+; wide range, no NaNs)
  #   fp16 = float16   (use if bf16 misbehaves)
  #   fp32 = full precision (highest memory — only if you need it)
  # NOTE: fp16 and bf16 use the SAME memory (both 16-bit) — if bf16 still OOMs,
  # switching to fp16 won't help; free VRAM or use a smaller model_id/clip_length.
  precision: "bf16"
  # If a forward OOMs even at bf16, it runs on CPU and STAYS there (no per-tick
  # GPU↔CPU thrash); re-probe the GPU every N CPU forwards in case VRAM frees up
  # (0 = never re-probe, stay on CPU until restart).
  gpu_retry_every_calls: 30
  # "What V-JEPA 2 sees": PCA of the dense patch features → a colour map of the
  # scene (like the V-JEPA 2 paper's Fig. 1). Small extra cost per forward; on by
  # default, toggle live from the UI (CMD_FEATUREVIZ) or set false.
  feature_viz: true
  # How to show it. "overlay" (default) blends the feature colours SEMI-
  # TRANSPARENTLY onto the camera so the real scene shows through and the colours
  # line up with what they describe — the most legible for an audience. "side"
  # draws it as a separate panel beside the camera (doubles the frame width).
  feature_viz_mode: overlay
  # Overlay opacity (0..1): higher = stronger feature colours, lower = more of the
  # camera shows through. Only used in "overlay" mode.
  feature_viz_alpha: 0.5
  # Colour saturation of the feature map (0..1): the raw top-3-PCA→RGB is a garish
  # rainbow; pulling toward luminance makes it read as coherent regions. 1 = raw.
  feature_viz_saturation: 0.65
  # How often to run V-JEPA 2 — smaller = fresher predictions (more decisions per
  # second), at the cost of GPU compute (NOT extra VRAM; the same clip is scored,
  # just more often). This value governs the IN-PROCESS fallback path
  # (run_in_subprocess: false). In the default SUBPROCESS path the dedicated worker
  # is forward-bound and runs V-JEPA 2 on EVERY clip, so this gate doesn't throttle
  # it there. On a GPU with headroom, keep this low for the freshest risk signal.
  run_every_n_frames: 4
  # Run V-JEPA 2 (+ SSv2) in a SEPARATE process. V-JEPA 2 (ViT-L over a 64-frame
  # clip) holds the GIL for seconds per call; on a thread that freezes the camera
  # I/O and the robot stream stalls out. A separate process has its own GIL, so the
  # main loop only pays a tiny pickle cost. Set false to run it in-process on a
  # background thread (simpler, but the stream can stutter during inference).
  run_in_subprocess: true

# ── Temporal action recognition (Something-Something V2 style) ────────────────
temporal_action:
  window_size: 10              # rolling window of per-frame obstacle states
  approach_ratio: 0.6          # fraction of centre-zone frames → APPROACHING
  clear_ratio: 0.7             # fraction of absent frames → CLEARING
  movement_speed_threshold: 5.0  # px/frame to distinguish moving vs static
  # When YOLO sees no object but depth shows an obstacle within this distance (m)
  # ahead, feed it to the motion recogniser so walls aren't stuck at STATIC_CLEAR.
  depth_presence_range_m: 1.5

# ── Genuine SSv2 action recognition (VideoMAE, annotation/log only) ──────────
# Runs a real Something-Something-V2 video classifier over a clip; the
# "something" placeholder in the predicted label is filled with the object YOLO
# detected. Annotation/logging only — does NOT drive navigation. Falls back to a
# stub (still fills the object) when the model/weights are unavailable.
ssv2:
  enabled: true
  model_id: "MCG-NJU/videomae-base-finetuned-ssv2"
  num_frames: 16
  device: "auto"               # CUDA/ROCm → MPS (native Mac) → CPU (see HOW_TO_RUN.md)
  precision: "bf16"            # GPU compute dtype: bf16 | fp16 | fp32 (CPU/MPS → fp32)
  # SSv2 (VideoMAE) is the heaviest single stage (~100 ms/tick on CPU) and is
  # ANNOTATION/LOG ONLY — it does not drive navigation. Profiling on a live run
  # showed its ticks caused ~31% of camera frames to be dropped (pipeline 20 fps
  # vs 30 fps received) and pushed p95 latency to ~130 ms, making the UI feel
  # laggy and slowing the STOP reaction. This value is the CPU/in-process cadence
  # (auto-halved on a GPU). In the default subprocess path SSv2 runs off the main
  # process on its own job-based cadence, so a snappier caption there no longer
  # steals from the drive loop; lower it for a fresher caption at more GPU cost.
  run_every_n_frames: 16       # CPU cadence; auto-halved on a GPU
  # Subprocess cadence: in the default run_in_subprocess path SSv2 runs off the
  # main process, so this counts CLIPS handled by the worker (not camera frames).
  # 1 = every clip (freshest caption, but each clip then also pays the SSv2
  # forward, slowing the V-JEPA 2 update rate); 2 = every other clip (default,
  # keeps V-JEPA 2 fresh). Raise it to spend even less time on the caption.
  subprocess_run_every: 2
  min_confidence: 0.15         # below this the sentence is shown as tentative
  # Fills the SSv2 "something" slot when YOLO has no named object (a wall, or
  # nothing detected this frame) so the caption reads e.g. "Moving obstacle
  # closer" instead of the raw placeholder "something". Set "" to keep "something".
  unknown_object_label: "obstacle"

# ── Depth free-space channel (Depth-Anything V2, class-agnostic geometry) ─────
# Monocular depth → nearest obstacle straight ahead (metres, feeds the governor)
# + which third (LEFT/CENTER/RIGHT) is most open (gives REROUTE a direction).
# Sees walls/doors/furniture regardless of YOLO classes. Falls back to off when
# transformers/weights are unavailable (ultrasonic + V-JEPA 2 still run). Prefer
# a GPU/MPS box; the metric-indoor Small model is the light default.
depth:
  enabled: true
  model_id: "depth-anything/Depth-Anything-V2-Metric-Indoor-Small-hf"
  device: "auto"               # CUDA/ROCm → MPS (native Mac) → CPU (see HOW_TO_RUN.md)
  precision: "bf16"            # GPU compute dtype: bf16 | fp16 | fp32 (CPU/MPS → fp32)
  run_every_n_frames: 6        # depth is expensive; auto-raised on CPU
  max_range_m: 5.0             # ceiling for depth readings (m)
  near_percentile: 15          # per-region percentile = "nearest obstacle" (robust to noise)
  path_band_frac: 0.6          # analyse the lower 60% of the frame (the path ahead)
  direction_margin_m: 0.3      # a side must be this much more open than centre to turn
  # Linear scale correction (see CALIBRATION.md): measure a known distance, read
  # what the HUD reports, set scale = actual / reported. 1.0 = raw model metres.
  scale: 1.148

# ── Goal-point navigation (Phase 2: track a clicked goal; HUD only, no motion) ──
# The operator clicks a point on the video (CMD_GOAL); the PC tracks it across
# frames and shows its bearing + depth on the HUD. Tracking uses CSRT when
# opencv-contrib is installed, else a template-match fallback.
goal:
  patch_frac: 0.12             # size of the tracked goal patch (fraction of frame)
  horizontal_fov_deg: 66.0     # camera horizontal field of view → bearing in degrees
  max_lost_frames: 15          # consecutive missed frames before the goal is "lost"
  arrival_distance_m: 0.4      # goal depth ≤ this → "reached" → stop + notify the UI
  # Goal-Following steering: if the goal's bearing exceeds this many degrees the
  # robot turns in place toward it; within it, it drives forward. (Safety/avoidance
  # always overrides.) Larger = drive straighter, turn less fussily.
  center_tolerance_deg: 12.0

# ── Decision fusion ────────────────────────────────────────────────────────────
# Thresholds must be coordinated with robot speed and pipeline latency: the
# heavy models run at only a few FPS on CPU, so a fast robot travels far between
# updates and hits obstacles before a STOP is computed. Keep the robot slow (see
# robot.speed_*) and the thresholds conservative so SLOW/STOP trigger early.
# The ultrasonic hard-STOP (robot.ultrasonic_stop_cm) is a separate, immediate
# safety layer and is the last line of defence regardless of these thresholds.
decision:
  weights:
    detector: 0.35
    world_model: 0.45
    temporal: 0.20
  low_risk_max: 0.25           # above this → SLOW (was 0.30; brake earlier)
  medium_risk_max: 0.50        # above this → STOP/REROUTE (was 0.60)
  hysteresis: 0.05
  # Risk rises immediately but DROPS at most this fast (risk units/second), so a
  # flickering YOLO detection (det spikes then vanishes for a frame) doesn't make
  # the robot stutter FORWARD↔STOP — the elevated risk is held ~0.5s and its
  # avoidance runs to completion. Raise for snappier release; lower to hold longer.
  risk_decay_per_s: 0.6
  stop_hold_seconds: 1.5

  # ── Closed-loop, context-aware reroute ─────────────────────────────────────
  # When closed_loop is on, a high-risk obstacle no longer triggers a fixed
  # back-up+spin. Instead the robot picks a behaviour from motion + object +
  # depth geometry: WAIT out a crossing/leaving obstacle (a person may move),
  # BACK UP from one rushing in, or TURN toward the more open side and keep
  # turning until the gap opens. Set closed_loop: false for the legacy one-shot.
  reroute:
    closed_loop: true
    wait_timeout_seconds: 2.0   # WAIT at most this long for a crossing obstacle, then TURN
    max_turn_seconds: 4.0       # keep turning at most this long, then STOP & reassess
    backup_distance_m: 0.35     # closer than this + approaching → BACK UP (don't turn into it)
    max_backup_seconds: 1.0     # cap reversing (no rear sensor) then STOP & reassess
    # The ultrasonic hard-stop is a reflex STOP. If the obstacle it sees won't
    # clear within this many seconds, escalate from a permanent STOP to the
    # avoidance maneuver (turn/back-up/rotate-to-search) to go AROUND it — the
    # sonar-seen obstacle often never raises the vision risk (YOLO can't classify a
    # wall), so without this the robot just sits stopped and never reroutes.
    ultrasonic_escalate_seconds: 1.5
    # Once maneuvering around a sonar obstacle, keep clearing it until the
    # ultrasonic risk drops below this before resuming FORWARD (hysteresis).
    # 1.0 = resume the instant we're at the stop distance (causes forward/backward
    # oscillation); lower = require more clearance first. 0.5 ≈ clear to ~2× the
    # stop distance before driving forward again.
    ultrasonic_resume_risk: 0.5
    # A side must beat the centre free-space to TURN toward it — by this absolute
    # margin OR by direction_margin_frac (relative). The relative test is what
    # makes reroute work on UNCALIBRATED depth, whose per-side gaps are only a few
    # cm / percent: the old absolute-only 0.3 m was unreachable, so the robot never
    # turned and just sat in STOP. Lower these to turn more readily, raise to turn
    # only for a clearly-open side.
    direction_margin_m: 0.05        # absolute: turn if a side is >5 cm more open than centre
    direction_margin_frac: 0.10     # relative: OR >10% more open than centre (calibration-free)
    dynamic_classes: ["person", "cat", "dog"]   # obstacles likely to move out of the way

  # ── Kinematic safe-speed governor (proactive collision avoidance) ──────────
  # Caps the action so the robot can always stop within the confirmed-clear
  # distance ahead, accounting for the AI's reaction latency:
  #   d_stop(v) = v*t_react + (v^2 - v_target^2)/(2*a) + margin
  # It only ever slows the robot down (FORWARD→SLOW→STOP), never speeds it up,
  # and is skipped when the ultrasonic is blind (the hard-stop still applies).
  #
  # CALIBRATE these on the real robot (see README "Calibrating the speed
  # governor") — the defaults are conservative guesses, not measured values:
  governor:
    enabled: true
    forward_speed_mps: 0.337  # measured robot speed at the FORWARD action (m/s)
    slow_speed_mps: 0.32  # measured robot speed at the SLOW action (m/s)
    max_decel_mps2: 0.188  # measured hardest deceleration the robot achieves
    target_speed_mps: 0.0      # speed to reach before contact (0 = full stop; >0 = reduce impact)
    safety_margin_m: 0.10      # extra buffer added to every stopping distance
    min_reaction_s: 0.2        # floor on the measured pipeline latency
    max_reaction_s: 3.0        # cap on it (a stalled pipeline → near-stop, bounded)

# ── World-anchored map: dead-reckoned pose ──────────────────────────────────────
# The robot has NO odometry, so its world position is ESTIMATED by integrating the
# commanded action × calibrated speed × dt (pose_estimator.py). FORWARD/SLOW reuse
# the governor's forward_speed_mps / slow_speed_mps above (single source of truth);
# these two add the missing constants. Open-loop → drifts; CALIBRATE on the robot.
pose:
  turn_rate_dps: 45.0        # measured in-place turn rate (deg/s) for TURN / REROUTE
  backup_speed_mps: 0.04     # measured reverse speed at the BACKUP action (m/s)

# ── Robot motor control ────────────────────────────────────────────────────────
robot:
  # tankMotor.setMotorModel(left, right) — range −4095 … +4095
  speed_full: 1500
  speed_slow: 800
  speed_stop: 0
  # Reroute: turn for this many seconds then resume
  reroute_turn_seconds: 1.2
  reroute_direction: "left"    # "left" | "right"
  # Ultrasonic hard-STOP distance (cm) — deterministic safety, separate from the
  # AI risk. Raised from 15→30 so the robot halts with margin instead of creeping
  # into the wall (a slow robot + a few-FPS pipeline needs the extra distance).
  ultrasonic_stop_cm: 30.0
  # Reuse the last valid sonic reading for this long when a ping misses, so one
  # HC-SR04 drop-out (common off angled/soft walls) doesn't drop a close obstacle
  # back to "clear". Beyond this the hard-stop releases and vision drives.
  ultrasonic_blind_hold_seconds: 1.0
  # Ultrasonic check also guards the AI-driven forward motion
  use_ultrasonic_guard: true

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  log_dir: "../../logs_rpi"
  log_level: "INFO"
  save_annotated_frames: true
  annotated_frame_interval: 5
  # Raw (un-annotated) camera frames → logs_rpi/<run>/raw_frames/, for offline
  # V-JEPA 2 anchor calibration (calibrate_from_logs.py --anchors). OFF by default
  # (extra disk); turn on before a run you plan to calibrate from. Zero extra
  # driving — reuse any normal run.
  save_raw_frames: false
  raw_frame_interval: 5
  csv_log: true
  # Initial state of run logging (CSV + annotated frames). ON by default so a run
  # is captured to logs_rpi/ without any extra step (matches the UI toggle, which
  # also defaults on). The operator can flip it at runtime from the UI toggle, or
  # override at startup with --logging on/off or the NAV_LOGGING=1/0 env var.
  # NOTE (Docker): logs are written INSIDE the container — mount the host dir
  # (`-v "$(pwd)/logs_rpi:/app/logs_rpi"`, or use docker-compose) or they vanish
  # when a `--rm` container exits.
  enabled: true

# ── TCP / Server ───────────────────────────────────────────────────────────────
server:
  # UI viewer ports (ai_viewer.py connects here)
  cmd_port: 5003
  video_port: 8003
  # Robot (Pi) ports – robot connects here as TCP client
  robot_cmd_port: 5004
  robot_video_port: 8004
  # How often (seconds) to broadcast AI status to connected clients
  status_broadcast_interval: 0.5

# ── Visualization ──────────────────────────────────────────────────────────────
visualization:
  show_window: false            # set true only if a display is attached to the Pi
  window_name: "Predictive Navigation"
  overlay_detections: true      # detection boxes (spatial) — stay on the video
  overlay_risk_bar: true        # risk bar — stays on the video
  overlay_action: true          # current action label — stays on the video
  # Text overlays below default OFF: they're shown in the UI panel BELOW the video
  # to keep the image uncluttered. Set true to burn them back onto the frame.
  overlay_world_model_label: false   # V-JEPA 2 label + motion pattern text
  overlay_sonic: false               # ultrasonic distance text
  overlay_fps: false                 # FPS counter
  overlay_mode_badge: false          # predictive/baseline badge
  overlay_ssv2: false                # SSv2 caption sentence
  overlay_depth_text: false          # depth "X.XXm ahead" text (L/C/R bars stay)
  # Annotated frames are sent via the video TCP channel
  stream_annotated: true
