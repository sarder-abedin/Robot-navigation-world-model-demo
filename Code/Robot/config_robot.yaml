# ─────────────────────────────────────────────────────────────────────────────
# Robot Client Configuration  (Raspberry Pi side)
# ─────────────────────────────────────────────────────────────────────────────

# ── Mode ──────────────────────────────────────────────────────────────────────
mode: live          # "live" (hardware) | "demo" (no hardware, for testing)

# ── PC Server address ─────────────────────────────────────────────────────────
# Set this to the IP address of the PC running main_server.py
server_ip: "192.168.1.100"

# Robot-specific TCP ports (different from the UI viewer ports 5003/8003)
robot_cmd_port: 5004
robot_video_port: 8004

# ── Object detection ─────────────────────────────────────────────────────────
# There is NO detector on the Pi. All AI (YOLO11n, V-JEPA 2, SSv2) runs on the PC
# server, which detects on the camera frames the Pi streams. The Pi only sends
# the ultrasonic distance (CMD_SONIC) as its local hard-stop safety. Detector
# settings live in the server's config.yaml.

# ── Camera (Pi camera settings) ───────────────────────────────────────────────
# Orientation is applied at capture on the Pi, so the corrected frame flows to
# the UI, V-JEPA 2 and YOLO alike. Default is upright (no flip). If your camera
# is mounted inverted and the image looks upside-down, set both to true (or pass
# -e CAMERA_HFLIP=1 -e CAMERA_VFLIP=1 at runtime).
camera:
  stream_width: 400
  stream_height: 300
  hflip: false
  vflip: false

# ── GPIO chip ─────────────────────────────────────────────────────────────────
# Pi 5 kernel ≥ 6.6 (pinctrl-rp1): /dev/gpiochip0   ← current default
# Pi 5 kernel  < 6.6               /dev/gpiochip4
# Pi 4 and earlier                 /dev/gpiochip0
# Run `gpiodetect` to confirm – look for the chip labelled "pinctrl-rp1" or "pinctrl-bcm2711"
gpio:
  chip: 0

# ── Motor control ─────────────────────────────────────────────────────────────
# PWM duty is signed and maxes at 4095 (see motor.py _MAX_DUTY). 1500 is only
# ~37% duty, which often just twitches the robot without sustaining motion on the
# floor. 3000 (~73%) / 1800 (~44%) move it reliably. Lower these if it's too fast.
robot:
  # PWM duty out of 4095 — keep it SLOW. The PC pipeline (V-JEPA 2 + SSv2 on CPU)
  # runs at only a few fps, so a fast robot outruns its own perception and hits
  # obstacles before a STOP is computed. 1600 (~39%) is a slow, reactive crawl.
  # If it doesn't start moving, raise it a little; if still too fast, lower it.
  # Tune live without rebuilding: docker run ... -e SPEED_FULL=1700 -e SPEED_SLOW=1000
  speed_full: 1600
  speed_slow: 1000
  # Ramp PWM on big jumps so the motor inrush current doesn't brown out the Pi
  # (symptom: the Pi drops off the network the instant it starts to drive).
  soft_start: true
  # Motor watchdog (failsafe): if no command arrives from the PC for this many
  # seconds — a pipeline/server stall, a stalled video stream, or a silently
  # half-open TCP link — the last drive command would otherwise keep the motors
  # running into an obstacle. The Pi stops the motors after this timeout. Set to
  # 0 to disable. Keep it comfortably above the PC's decision interval.
  command_watchdog_seconds: 1.5
  reroute_turn_seconds: 1.2

# ── Ultrasonic sensor ─────────────────────────────────────────────────────────
ultrasonic:
  trigger_pin: 27
  echo_pin: 22
  read_interval: 0.1   # seconds between readings sent to PC
